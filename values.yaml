# Coder Helm Chart Values for Docker Desktop or Rancher Desktop Kubernetes
# This configuration is optimized for local development

coder:
  # Environment variables for Coder
  env:
    # Database connection - references the Kubernetes secret
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url

    # Override with CODER_ACCESS_URL when deploying if workspace pods require
    # a non-loopback URL to reach Coder.
    - name: CODER_ACCESS_URL
      value: "http://localhost:8080"

    # Wildcard access URL for workspace apps
    - name: CODER_WILDCARD_ACCESS_URL
      value: "*.localhost:8080"

  # Service configuration
  service:
    # A ClusterIP service works with both Docker Desktop and Rancher Desktop.
    # Access it locally with the port-forward command shown by deploy.sh.
    type: ClusterIP
    annotations: {}

  # Image configuration
  image:
    repo: "ghcr.io/coder/coder"
    tag: "latest"
    pullPolicy: IfNotPresent

  # Resources (adjust based on your local machine capacity)
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "10Gi"

  # Replica count
  replicaCount: 1

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  # Pod annotations
  podAnnotations: {}

  # Tolerations and affinity
  tolerations: []
  affinity: {}
  nodeSelector: {}
